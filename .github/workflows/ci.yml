name: CI

on: [push, pull_request]

jobs:
  Test:
    strategy:
      fail-fast: true
      matrix:
        os: [
          macos-15,
          ubuntu-24.04 # Can’t use ubuntu-latest due to  https://github.com/tree-sitter/parser-test-action/issues/33
        ]
    runs-on: ${{ matrix.os }}
    steps:
    - name: Check out repository
      uses: actions/checkout@v7

    - name: Set up Tree-sitter
      uses: tree-sitter/setup-action@v2
      with:
        install-lib: false

    - name: Run tests
      uses: tree-sitter/parser-test-action@v3
      with:
        generate: false
        test-rust: true
        test-node: true
        test-python: true
        test-go: true
        test-swift: false # https://github.com/tree-sitter/parser-test-action/issues/31

    - name: Clone LilyPond regression test files
      run: git clone https://gitlab.com/lilypond/lilypond.git lilypond-source --single-branch --depth=1 --filter=blob:none

    - name: Parse LilyPond regression test files
      uses: tree-sitter/parse-action@v5
      id: lilypond
      with:
        files: |
          lilypond-source/**/*.ly
          !lilypond-source/input/regression/bom-mark.ly
          !lilypond-source/input/regression/other/display-lily-tests.ly
